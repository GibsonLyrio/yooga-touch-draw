services:
  app:
    build:
      context: .
      args:
        VITE_BASE_PATH: /yooga-touch-draw/
    image: yooga-touch-draw:local
    container_name: yooga-touch-draw
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
