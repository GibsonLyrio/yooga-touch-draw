server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /yooga-touch-draw {
        return 308 /yooga-touch-draw/;
    }

    location /yooga-touch-draw/ {
        try_files $uri $uri/ /yooga-touch-draw/index.html;
    }

    # Also supports Caddy's handle_path, which removes the prefix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

